<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Email Body Editor</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: "Segoe UI", sans-serif; }
  #toolbar {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 6px; background: #f3f4f6; border-bottom: 1px solid #d1d5db;
  }
  #toolbar button {
    border: 1px solid #d1d5db; background: #ffffff; border-radius: 4px;
    padding: 4px 10px; font-size: 13px; cursor: pointer; color: #1f2937;
  }
  #toolbar button:hover { background: #e5e7eb; }
  #toolbar .sep { width: 1px; background: #d1d5db; margin: 2px 4px; }
  #editor {
    flex: 1 1 auto; overflow-y: auto; padding: 12px 16px;
    font-size: 14px; color: #111827; outline: none; line-height: 1.5;
  }
  #editor a { color: #1d4ed8; }
</style>
</head>
<body>
  <div id="toolbar">
    <button type="button" data-cmd="bold"><b>B</b></button>
    <button type="button" data-cmd="italic"><i>I</i></button>
    <button type="button" data-cmd="underline"><u>U</u></button>
    <span class="sep"></span>
    <button type="button" data-cmd="insertUnorderedList">Bullet List</button>
    <button type="button" data-cmd="insertOrderedList">Numbered List</button>
    <span class="sep"></span>
    <button type="button" id="btnLink">Link</button>
    <button type="button" data-cmd="removeFormat">Clear Formatting</button>
  </div>
  <div id="editor" contenteditable="true"></div>

<script>
  const editor = document.getElementById('editor');

  document.querySelectorAll('#toolbar button[data-cmd]').forEach(btn => {
    btn.addEventListener('click', () => {
      editor.focus();
      document.execCommand(btn.getAttribute('data-cmd'), false, null);
    });
  });

  document.getElementById('btnLink').addEventListener('click', () => {
    const url = window.prompt('Link URL:', 'https://');
    if (url) {
      editor.focus();
      document.execCommand('createLink', false, url);
    }
  });

  // Called from the host app to read/replace the body HTML.
  window.getBody = () => editor.innerHTML;
  window.setBody = (html) => { editor.innerHTML = html; };

  // Called from the host app's merge-field buttons to insert a placeholder at the cursor.
  window.insertTextAtCursor = (text) => {
    editor.focus();
    document.execCommand('insertText', false, text);
  };

  // Called from the host app to insert report content (e.g. an HTML table) at the cursor.
  window.insertHtmlAtCursor = (html) => {
    editor.focus();
    document.execCommand('insertHTML', false, html);
  };
</script>
</body>
</html>
